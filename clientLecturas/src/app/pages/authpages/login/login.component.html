<div class="container mt-5 animate__animated animate__fadeIn d-flex flex-column align-items-center">
    <div class="registro-wrapper">
        <h2>Iniciar Sesión</h2>
        <form class="mt-3 registro-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div *ngIf="error" class="text-danger">
                <p>El correo o la contraseña no es correcto</p>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input id="email" type="email" formControlName="email" class="form-control" />
                <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">
                    El correo electrónico es obligatorio y debe ser válido.
                </div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password" class="form-control" />
                <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                    class="text-danger">
                    La contraseña es obligatoria.
                </div>
            </div>
            <br>
            <button type="submit" class="btn btn-outline-primary btn-registrar" [disabled]="loginForm.invalid">Iniciar
                Sesión</button>
        </form>
        <p class="mt-2 cuenta-txt">¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>
</div>

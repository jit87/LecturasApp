<div class="container home py-5 animate__animated animate__fadeIn">
    <button class="btn-volver btn btn-outline-secondary mt-3" (click)="regresar()">Volver</button>
    <p *ngIf="disponibles1==false && disponibles2 == false" class="error">No hay información disponible</p>

    <div class="mt-4" *ngIf="cargado==false" style="text-align: center;">
        <div class="spinner-border m-5" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>
    <div class="review-wrapper mt-4">
        <div class="review-header">
            <img src="{{libro.imagen}}" alt="Portada del libro" class="image">
            <div class="review-info">
                <h2 class="review-titulo">{{ libro.titulo }}</h2>
                <p class="review-autor-libro">{{ libro.autores }}</p>
            </div>
        </div>
        <hr>
        <div class="review-usuario mb-3">
            <img [src]="imagen || 'default.png'" class="rounded-circle" width="35" height="35">
            <span>{{ usuario }}</span>
        </div>
        <div class="description-review">
            <p>{{ libro.resena }}</p>
        </div>
    </div>
</div>
